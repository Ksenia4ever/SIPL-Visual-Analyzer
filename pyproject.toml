[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sipl-visual-analyzer"
version = "1.0.0"
description = "SIPL toolkit for parsing, execution, visualization and formal semantics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

keywords = [
    "SIPL",
    "parser",
    "interpreter",
    "AST",
    "formal-semantics",
    "visualization"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Interpreters"
]

dependencies = [
    "lark>=1.2,<2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8"
]

[project.scripts]
sipl = "sipl.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sipl = ["grammar.lark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["sipl"]
branch = true

[tool.coverage.report]
show_missing = true
